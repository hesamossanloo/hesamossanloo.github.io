<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Secret Keeper Chatbot</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f3ee;
        --panel: #fffdf9;
        --ink: #1f272a;
        --muted: #657175;
        --line: #ddd6cc;
        --accent: #0f6b5f;
        --accent-dark: #0a4f47;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(980px, calc(100% - 28px));
        margin: 0 auto;
        padding: 28px 0;
      }

      .shell {
        display: grid;
        grid-template-rows: auto minmax(420px, 1fr) auto;
        min-height: calc(100vh - 56px);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 18px 42px rgba(31, 38, 42, 0.1);
      }

      header {
        padding: 20px;
        border-bottom: 1px solid var(--line);
      }

      h1 {
        margin: 0 0 4px;
        font-size: 24px;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: var(--muted);
      }

      .messages {
        display: grid;
        align-content: start;
        gap: 12px;
        padding: 20px;
        overflow: auto;
      }

      .message {
        max-width: min(760px, 88%);
        border-radius: 8px;
        padding: 12px 14px;
        line-height: 1.45;
        white-space: pre-wrap;
      }

      .assistant {
        background: #eef3f1;
      }

      .user {
        justify-self: end;
        background: #dcece8;
      }

      form {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        padding: 16px;
        border-top: 1px solid var(--line);
      }

      input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 12px;
        font: inherit;
      }

      button {
        border: 0;
        border-radius: 6px;
        background: var(--accent);
        color: white;
        font: inherit;
        font-weight: 800;
        padding: 12px 16px;
        cursor: pointer;
      }

      button:hover {
        background: var(--accent-dark);
      }

      @media (max-width: 680px) {
        main {
          width: min(100% - 16px, 980px);
          padding: 8px 0;
        }

        .shell {
          min-height: calc(100vh - 16px);
        }

        header,
        form {
          grid-template-columns: 1fr;
        }

        header {
          display: grid;
        }

        .message {
          max-width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="shell">
        <header>
          <div>
            <h1>Secret Keeper Chatbot</h1>
            <p>Share surprise plans privately. I compare them without revealing the secret.</p>
          </div>
        </header>
        <div class="messages" id="messages"></div>
        <form id="chat-form">
          <input
            id="message"
            autocomplete="off"
            placeholder="Tell me your name, session, couple code, or surprise idea..."
          />
          <button type="submit">Send</button>
        </form>
      </section>
    </main>

    <script>
      const apiBase = "https://secret-keeper-chatbot.netlify.app";
      const state = {
        sessionId: localStorage.getItem("sk_session") || "japan-2026",
        accessCode: localStorage.getItem("sk_code") || "",
      };

      const messages = document.querySelector("#messages");
      const form = document.querySelector("#chat-form");
      const input = document.querySelector("#message");

      function addMessage(role, text) {
        const node = document.createElement("div");
        node.className = `message ${role}`;
        node.textContent = text;
        messages.append(node);
        messages.scrollTop = messages.scrollHeight;
      }

      function captureAccessDetails(text) {
        const sessionMatch = text.match(/session\s*[:=]\s*([a-z0-9-]+)/i);
        const codeMatch = text.match(/code\s*[:=]\s*([A-Za-z0-9_-]+)/i);
        if (sessionMatch) {
          state.sessionId = sessionMatch[1];
          localStorage.setItem("sk_session", state.sessionId);
        }
        if (codeMatch) {
          state.accessCode = codeMatch[1];
          localStorage.setItem("sk_code", state.accessCode);
        }
      }

      async function callChat(message) {
        const response = await fetch(`${apiBase}/api/chat`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            sessionId: state.sessionId,
            accessCode: state.accessCode,
            message,
          }),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Request failed");
        return data.reply;
      }

      addMessage(
        "assistant",
        "I am Secret Keeper. My job is to help two sides plan surprises without accidentally choosing the same thing.\n\nTell me your name and what you want to do. If you already have access, include it like this: session: japan-2026 code: your-code. I can understand English or German."
      );

      form.addEventListener("submit", async event => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text) return;
        input.value = "";
        addMessage("user", text);
        captureAccessDetails(text);

        if (!state.accessCode) {
          addMessage(
            "assistant",
            "Before I can save or compare secrets, send your private access code in this format: code: your-code"
          );
          return;
        }

        try {
          const reply = await callChat(text);
          addMessage("assistant", reply);
        } catch (error) {
          addMessage("assistant", error instanceof Error ? error.message : "Something went wrong.");
        }
      });
    </script>
  </body>
</html>
