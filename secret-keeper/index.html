<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Secret Keeper Chatbot</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #eee2cf;
        --panel: rgba(255, 252, 244, 0.42);
        --panel-strong: rgba(255, 252, 244, 0.78);
        --ink: #172533;
        --muted: #5c6770;
        --line: rgba(34, 65, 91, 0.22);
        --accent: #b3402e;
        --accent-dark: #8f2e22;
        --indigo: #173f5f;
        --indigo-soft: rgba(23, 63, 95, 0.1);
        --wave: #dfeff0;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          linear-gradient(rgba(244, 237, 223, 0.36), rgba(244, 237, 223, 0.48)),
          url("/secret-keeper/assets/great-wave-bg.jpg") center center / cover fixed,
          var(--bg);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(circle at 50% 18%, rgba(255, 252, 244, 0.22), transparent 34%),
          linear-gradient(90deg, rgba(255, 252, 244, 0.08), rgba(23, 63, 95, 0.04));
      }

      main {
        position: relative;
        width: min(980px, calc(100% - 28px));
        margin: 0 auto;
        padding: 28px 0;
      }

      .shell {
        display: grid;
        grid-template-rows: auto minmax(420px, 1fr) auto;
        min-height: calc(100vh - 56px);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 18px 46px rgba(16, 35, 49, 0.2);
        backdrop-filter: blur(4px) saturate(112%);
      }

      header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        padding: 20px;
        border-bottom: 1px solid var(--line);
        background: linear-gradient(90deg, rgba(255, 252, 244, 0.62), rgba(223, 239, 240, 0.42));
      }

      h1 {
        margin: 0 0 4px;
        font-size: 24px;
        letter-spacing: 0;
        color: var(--indigo);
      }

      p {
        margin: 0;
        color: var(--muted);
      }

      .couple-label {
        display: none;
        flex: 0 0 auto;
        border: 1px solid rgba(179, 64, 46, 0.34);
        border-radius: 999px;
        padding: 7px 10px;
        background: rgba(255, 252, 244, 0.72);
        color: var(--accent-dark);
        font-size: 13px;
        font-weight: 800;
        line-height: 1;
        white-space: nowrap;
      }

      .couple-label[data-visible="true"] {
        display: inline-flex;
      }

      .messages {
        display: grid;
        align-content: start;
        gap: 12px;
        padding: 20px;
        overflow: auto;
        background: rgba(255, 252, 244, 0.08);
      }

      .message {
        max-width: min(760px, 88%);
        border-radius: 8px;
        padding: 12px 14px;
        line-height: 1.45;
        white-space: pre-wrap;
        border: 1px solid rgba(23, 63, 95, 0.12);
        box-shadow: 0 8px 22px rgba(16, 35, 49, 0.08);
      }

      .prank-image {
        display: block;
        width: min(260px, 100%);
        height: auto;
        margin-top: 10px;
        border-radius: 8px;
      }

      .assistant {
        background: var(--panel-strong);
      }

      .loading {
        display: inline-grid;
        grid-auto-flow: column;
        align-items: center;
        gap: 6px;
        min-width: 72px;
      }

      .loading span {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: var(--accent);
        animation: bounce 0.9s infinite ease-in-out;
      }

      .loading span:nth-child(2) {
        animation-delay: 0.12s;
      }

      .loading span:nth-child(3) {
        animation-delay: 0.24s;
      }

      @keyframes bounce {
        0%,
        80%,
        100% {
          opacity: 0.35;
          transform: translateY(0);
        }

        40% {
          opacity: 1;
          transform: translateY(-4px);
        }
      }

      .user {
        justify-self: end;
        background: linear-gradient(135deg, rgba(223, 239, 240, 0.9), rgba(248, 234, 217, 0.86));
      }

      form {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        padding: 16px;
        border-top: 1px solid var(--line);
        background: rgba(255, 252, 244, 0.52);
      }

      input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 12px;
        font: inherit;
        color: var(--ink);
        background: rgba(255, 252, 244, 0.9);
      }

      input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(179, 64, 46, 0.14);
        outline: 0;
      }

      button {
        border: 0;
        border-radius: 6px;
        background: var(--accent);
        color: white;
        font: inherit;
        font-weight: 800;
        padding: 12px 16px;
        cursor: pointer;
      }

      button:hover {
        background: var(--accent-dark);
      }

      button:disabled,
      input:disabled {
        cursor: wait;
        opacity: 0.72;
      }

      @media (max-width: 680px) {
        body {
          background:
            linear-gradient(rgba(244, 237, 223, 0.32), rgba(244, 237, 223, 0.56)),
            url("/secret-keeper/assets/great-wave-bg.jpg") 38% center / auto 100% no-repeat fixed,
            var(--bg);
        }

        main {
          width: min(100% - 16px, 980px);
          padding: 8px 0;
        }

        .shell {
          min-height: calc(100vh - 16px);
          grid-template-rows: auto minmax(0, 1fr) auto;
        }

        form {
          grid-template-columns: 1fr;
        }

        header {
          align-items: stretch;
          flex-direction: column;
          gap: 10px;
        }

        .couple-label {
          align-self: flex-start;
        }

        .message {
          max-width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="shell">
        <header>
          <div>
            <h1>Secret Keeper Chatbot</h1>
            <p>Share surprise plans privately. I compare them without revealing the secret.</p>
          </div>
          <span class="couple-label" id="couple-label"></span>
        </header>
        <div class="messages" id="messages"></div>
        <form id="chat-form">
          <input
            id="message"
            autocomplete="off"
            placeholder="First tell me who you are..."
          />
          <button type="submit">Send</button>
        </form>
      </section>
    </main>

    <script>
      const apiBase = "https://secret-keeper-service.netlify.app";
      localStorage.removeItem("sk_code");
      localStorage.removeItem("sk_couple_label");
      const state = {
        sessionId: "japan-2026",
        pair: "",
        accessCode: "",
        coupleLabel: "",
        codeChanged: false,
        needsCodeChange: false,
      };

      const messages = document.querySelector("#messages");
      const form = document.querySelector("#chat-form");
      const input = document.querySelector("#message");
      const coupleLabel = document.querySelector("#couple-label");

      function updateCoupleLabel(label) {
        state.coupleLabel = label || "";
        if (state.coupleLabel) {
          coupleLabel.textContent = state.coupleLabel;
          coupleLabel.dataset.visible = "true";
        } else {
          coupleLabel.textContent = "";
          coupleLabel.dataset.visible = "false";
        }
      }

      function addMessage(role, text) {
        const node = document.createElement("div");
        node.className = `message ${role}`;
        const prankMarker = "[[GORILLA_PRANK]]";
        if (text.includes(prankMarker)) {
          const cleanText = text.replace(prankMarker, "").trim();
          node.textContent = cleanText;
          const image = document.createElement("img");
          image.className = "prank-image";
          image.src = "/secret-keeper/gorilla-prank.png";
          image.alt = "Secret Keeper says nice try";
          node.append(image);
        } else {
          node.textContent = text;
        }
        messages.append(node);
        messages.scrollTop = messages.scrollHeight;
      }

      function addLoadingMessage() {
        const node = document.createElement("div");
        node.className = "message assistant";
        node.setAttribute("aria-label", "Secret Keeper is thinking");
        const loading = document.createElement("div");
        loading.className = "loading";
        loading.innerHTML = "<span></span><span></span><span></span>";
        node.append(loading);
        messages.append(node);
        messages.scrollTop = messages.scrollHeight;
        return node;
      }

      function setBusy(isBusy) {
        input.disabled = isBusy;
        form.querySelector("button").disabled = isBusy;
      }

      function identifyPair(text) {
        const normalized = text.toLowerCase();
        if (/\b(chris|christian|meike)\b/.test(normalized)) return "cm";
        if (/\b(hesam|jana)\b/.test(normalized)) return "hj";
        return "";
      }

      function pairLabel(pair) {
        return pair === "hj" ? "Hesam and Jana" : "Christian and Meike";
      }

      async function getCodeStatus(pair) {
        const response = await fetch(`${apiBase}/api/code-status`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            sessionId: state.sessionId,
            pair,
          }),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Request failed");
        return data;
      }

      function captureAccessDetails(text) {
        const sessionMatch = text.match(/session\s*[:=]\s*([a-z0-9-]+)/i);
        const codeMatch = text.match(/^code\s*[:=]\s*(\S+)$/i);
        const bareCodeMatch = text.match(/^\S{4,}$/);
        if (sessionMatch) {
          state.sessionId = sessionMatch[1];
        }
        if (codeMatch || bareCodeMatch) {
          state.accessCode = codeMatch ? codeMatch[1] : text;
        }
      }

      async function callChat(message) {
        let response;
        try {
          response = await fetch(`${apiBase}/api/chat`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              sessionId: state.sessionId,
              pair: state.pair || undefined,
              accessCode: state.accessCode,
              message,
            }),
          });
        } catch (error) {
          const isLocalFile = window.location.protocol === "file:";
          throw new Error(
            isLocalFile
              ? "The chat cannot call the API from a file:// page. Use https://hesam.info/secret-keeper/ or run a local web server."
              : "I cannot reach the Secret Keeper API right now. Check the Netlify deployment and try again."
          );
        }
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Request failed");
        if (data.coupleLabel) updateCoupleLabel(data.coupleLabel);
        if (typeof data.needsCodeChange === "boolean") state.needsCodeChange = data.needsCodeChange;
        if (data.codeChanged) {
          state.codeChanged = true;
          state.needsCodeChange = false;
        }
        return data.reply;
      }

      updateCoupleLabel(state.coupleLabel);

      addMessage(
        "assistant",
        "I am Secret Keeper. My job is to help two sides plan surprises without accidentally choosing the same thing.\n\nFirst step: tell me who you are: Chris, Meike, Hesam, or Jana."
      );

      form.addEventListener("submit", async event => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text) return;
        input.value = "";
        addMessage("user", text);

        if (!state.pair) {
          const pair = identifyPair(text);
          if (!pair) {
            addMessage("assistant", "Please tell me who you are: Chris, Meike, Hesam, or Jana.");
            return;
          }

          const loadingMessage = addLoadingMessage();
          setBusy(true);
          try {
            const status = await getCodeStatus(pair);
            state.pair = status.pair;
            state.codeChanged = Boolean(status.changed);
            updateCoupleLabel(status.coupleLabel || pairLabel(pair));
            input.placeholder = state.codeChanged ? "Enter your private code" : "Enter code: your-code";
            loadingMessage.remove();
            addMessage("assistant", status.prompt);
          } catch (error) {
            loadingMessage.remove();
            addMessage("assistant", error instanceof Error ? error.message : "Something went wrong.");
          } finally {
            setBusy(false);
            input.focus();
          }
          return;
        }

        if (state.needsCodeChange) {
          if (/\s/.test(text) || text.length < 4) {
            addMessage("assistant", "Please choose a code with at least 4 characters and no whitespace.");
            return;
          }

          const previousAccessCode = state.accessCode;
          const loadingMessage = addLoadingMessage();
          setBusy(true);
          try {
            const reply = await callChat(`change my code to ${text}`);
            state.accessCode = text;
            input.placeholder = "Enter 3 activity options...";
            loadingMessage.remove();
            addMessage("assistant", reply);
          } catch (error) {
            state.accessCode = previousAccessCode;
            loadingMessage.remove();
            addMessage("assistant", error instanceof Error ? error.message : "Something went wrong.");
          } finally {
            setBusy(false);
            input.focus();
          }
          return;
        }

        captureAccessDetails(text);

        if (!state.accessCode) {
          addMessage(
            "assistant",
            state.codeChanged
              ? `Ok ${pairLabel(state.pair)}, please enter the new code you chose yourself.`
              : `Ok ${pairLabel(state.pair)}, please enter the code Hesam has given you like this: code: your-code`
          );
          return;
        }

        const loadingMessage = addLoadingMessage();
        setBusy(true);
        try {
          const reply = await callChat(text);
          loadingMessage.remove();
          addMessage("assistant", reply);
        } catch (error) {
          loadingMessage.remove();
          addMessage("assistant", error instanceof Error ? error.message : "Something went wrong.");
        } finally {
          setBusy(false);
          input.focus();
        }
      });
    </script>
  </body>
</html>
