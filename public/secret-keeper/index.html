<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Secret Keeper Chatbot</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #eee2cf;
        --panel: rgba(255, 252, 244, 0.9);
        --panel-strong: rgba(255, 252, 244, 0.96);
        --ink: #172533;
        --muted: #5c6770;
        --line: rgba(34, 65, 91, 0.22);
        --accent: #b3402e;
        --accent-dark: #8f2e22;
        --indigo: #173f5f;
        --indigo-soft: rgba(23, 63, 95, 0.1);
        --wave: #dfeff0;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          linear-gradient(rgba(244, 237, 223, 0.78), rgba(244, 237, 223, 0.86)),
          url("/secret-keeper/assets/great-wave-bg.jpg") center / cover fixed,
          var(--bg);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(circle at 50% 18%, rgba(255, 252, 244, 0.58), transparent 34%),
          linear-gradient(90deg, rgba(255, 252, 244, 0.16), rgba(23, 63, 95, 0.06));
      }

      main {
        position: relative;
        width: min(980px, calc(100% - 28px));
        margin: 0 auto;
        padding: 28px 0;
      }

      .shell {
        display: grid;
        grid-template-rows: auto minmax(420px, 1fr) auto;
        min-height: calc(100vh - 56px);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 18px 46px rgba(16, 35, 49, 0.18);
        backdrop-filter: blur(10px) saturate(112%);
      }

      header {
        padding: 20px;
        border-bottom: 1px solid var(--line);
        background: linear-gradient(90deg, rgba(255, 252, 244, 0.96), rgba(223, 239, 240, 0.86));
      }

      h1 {
        margin: 0 0 4px;
        font-size: 24px;
        letter-spacing: 0;
        color: var(--indigo);
      }

      p {
        margin: 0;
        color: var(--muted);
      }

      .messages {
        display: grid;
        align-content: start;
        gap: 12px;
        padding: 20px;
        overflow: auto;
        background: rgba(255, 252, 244, 0.56);
      }

      .message {
        max-width: min(760px, 88%);
        border-radius: 8px;
        padding: 12px 14px;
        line-height: 1.45;
        white-space: pre-wrap;
        border: 1px solid rgba(23, 63, 95, 0.12);
        box-shadow: 0 8px 22px rgba(16, 35, 49, 0.08);
      }

      .prank-image {
        display: block;
        width: min(260px, 100%);
        height: auto;
        margin-top: 10px;
        border-radius: 8px;
      }

      .assistant {
        background: var(--panel-strong);
      }

      .user {
        justify-self: end;
        background: linear-gradient(135deg, var(--wave), #f8ead9);
      }

      form {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        padding: 16px;
        border-top: 1px solid var(--line);
        background: rgba(255, 252, 244, 0.94);
      }

      input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 12px;
        font: inherit;
        color: var(--ink);
        background: rgba(255, 252, 244, 0.98);
      }

      input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(179, 64, 46, 0.14);
        outline: 0;
      }

      button {
        border: 0;
        border-radius: 6px;
        background: var(--accent);
        color: white;
        font: inherit;
        font-weight: 800;
        padding: 12px 16px;
        cursor: pointer;
      }

      button:hover {
        background: var(--accent-dark);
      }

      @media (max-width: 680px) {
        main {
          width: min(100% - 16px, 980px);
          padding: 8px 0;
        }

        .shell {
          min-height: calc(100vh - 16px);
        }

        header,
        form {
          grid-template-columns: 1fr;
        }

        header {
          display: grid;
        }

        .message {
          max-width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="shell">
        <header>
          <div>
            <h1>Secret Keeper Chatbot</h1>
            <p>Share surprise plans privately. I compare them without revealing the secret.</p>
          </div>
        </header>
        <div class="messages" id="messages"></div>
        <form id="chat-form">
          <input
            id="message"
            autocomplete="off"
            placeholder="Tell me your name, session, couple code, or surprise idea..."
          />
          <button type="submit">Send</button>
        </form>
      </section>
    </main>

    <script>
      const apiBase = "https://secret-keeper-service.netlify.app";
      const state = {
        sessionId: localStorage.getItem("sk_session") || "japan-2026",
        accessCode: localStorage.getItem("sk_code") || "",
      };

      const messages = document.querySelector("#messages");
      const form = document.querySelector("#chat-form");
      const input = document.querySelector("#message");

      function addMessage(role, text) {
        const node = document.createElement("div");
        node.className = `message ${role}`;
        const prankMarker = "[[GORILLA_PRANK]]";
        if (text.includes(prankMarker)) {
          const cleanText = text.replace(prankMarker, "").trim();
          node.textContent = cleanText;
          const image = document.createElement("img");
          image.className = "prank-image";
          image.src = "/secret-keeper/gorilla-prank.png";
          image.alt = "Secret Keeper says nice try";
          node.append(image);
        } else {
          node.textContent = text;
        }
        messages.append(node);
        messages.scrollTop = messages.scrollHeight;
      }

      function captureAccessDetails(text) {
        const sessionMatch = text.match(/session\s*[:=]\s*([a-z0-9-]+)/i);
        const codeMatch = text.match(/code\s*[:=]\s*([A-Za-z0-9_-]+)/i);
        if (sessionMatch) {
          state.sessionId = sessionMatch[1];
          localStorage.setItem("sk_session", state.sessionId);
        }
        if (codeMatch) {
          state.accessCode = codeMatch[1];
          localStorage.setItem("sk_code", state.accessCode);
        }
      }

      async function callChat(message) {
        let response;
        try {
          response = await fetch(`${apiBase}/api/chat`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              sessionId: state.sessionId,
              accessCode: state.accessCode,
              message,
            }),
          });
        } catch (error) {
          const isLocalFile = window.location.protocol === "file:";
          throw new Error(
            isLocalFile
              ? "The chat cannot call the API from a file:// page. Use https://hesam.info/secret-keeper/ or run a local web server."
              : "I cannot reach the Secret Keeper API right now. Check the Netlify deployment and try again."
          );
        }
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Request failed");
        return data.reply;
      }

      addMessage(
        "assistant",
        "I am Secret Keeper. My job is to help two sides plan surprises without accidentally choosing the same thing.\n\nTell me your name and what you want to do. If you already have access, include it like this: session: japan-2026 code: your-code. I can understand English or German."
      );

      form.addEventListener("submit", async event => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text) return;
        input.value = "";
        addMessage("user", text);
        captureAccessDetails(text);

        if (!state.accessCode) {
          addMessage(
            "assistant",
            "Before I can save or compare secrets, send your private access code in this format: code: your-code"
          );
          return;
        }

        try {
          const reply = await callChat(text);
          addMessage("assistant", reply);
        } catch (error) {
          addMessage("assistant", error instanceof Error ? error.message : "Something went wrong.");
        }
      });
    </script>
  </body>
</html>
